# Self-hosted RAG (UC13 Variant B)
#
#   qdrant      vector database            -> volume qdrant_storage (persists across restarts)
#   embeddings  BGE-M3 via Hugging Face TEI -> volume hf_models (model downloaded once)
#   indexer     one-shot job: ingest the 50 PDFs, embed, fill Qdrant. Runs on every
#               `up`, but skips everything that is already indexed (takes seconds then).
#   api         FastAPI backend on port 8000, starts after the indexer succeeded
#
# The LLM is NOT part of this stack: point LLM_BASE_URL in .env at any OpenAI-compatible
# server (vLLM on an Azure GPU VM, Ollama, ...). Swapping the LLM never touches the index.
#
#   cp .env.example .env      # set LLM_BASE_URL / LLM_MODEL
#   docker compose up -d --build
#   curl http://localhost:8000/health

name: privrag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_storage:/qdrant/storage
    # not published to the host; only the api/indexer talk to it

  embeddings:
    image: ${EMBED_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.7}
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3", "--max-client-batch-size", "32", "--auto-truncate"]
    volumes:
      - hf_models:/data
    # GPU host: set EMBED_IMAGE=ghcr.io/huggingface/text-embeddings-inference:1.7 and uncomment
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]

  indexer:
    build: .
    image: ${API_IMAGE:-privrag-api:latest}
    command: ["privrag", "init"]
    restart: "no"
    env_file: [.env]
    environment: &privrag_env
      PRIVRAG_QDRANT_URL: http://qdrant:6333
      PRIVRAG_EMBED_URL: ${EMBED_URL:-http://embeddings:80/v1}
      PRIVRAG_EMBED_MODEL: bge-m3
      PRIVRAG_LLM_BACKEND: openai
      PRIVRAG_LLM_BASE_URL: ${LLM_BASE_URL:?set LLM_BASE_URL in .env}
      PRIVRAG_LLM_MODEL: ${LLM_MODEL:?set LLM_MODEL in .env}
      PRIVRAG_LLM_API_KEY: ${LLM_API_KEY:-not-needed}
    volumes:
      - app_data:/data
    depends_on:
      - qdrant
      - embeddings

  api:
    image: ${API_IMAGE:-privrag-api:latest}
    restart: unless-stopped
    env_file: [.env]
    environment: *privrag_env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # lets LLM_BASE_URL point at an LLM on the host
    depends_on:
      indexer:
        condition: service_completed_successfully

volumes:
  qdrant_storage:
  hf_models:
  app_data:
