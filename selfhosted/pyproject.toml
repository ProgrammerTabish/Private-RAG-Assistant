[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privrag"
version = "0.1.0"
description = "Self-hosted, open-source RAG pipeline for banking compliance documents (UC13, Variant B)"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymupdf>=1.24",
  "qdrant-client>=1.12",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "joblib>=1.3",
  "langchain-core>=0.3",
  "langchain-text-splitters>=0.3",
  "langchain-openai>=0.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Real models - installed on the Azure GPU/CPU hosts, not needed for local tests
docling = ["docling>=2.0"]
models = ["FlagEmbedding>=1.2", "sentence-transformers>=3.0", "torch>=2.2"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[project.scripts]
privrag = "privrag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
  "corpus: needs the real 50-PDF corpus (slow)",
]

[tool.setuptools.package-data]
privrag = ["retrieve/*.json", "api/static/*.html"]
