<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --side:#eef0f4; --line:#e2e5ea; --text:#1b1f27; --muted:#636b78;
  --accent:#2f5bd3; --accent-soft:#e7edfc; --user:#2f5bd3; --user-text:#fff;
  --ok:#1f8a4c; --warn:#b26b00; --bad:#c23b3b; --chip:#eef1f6; --shadow:0 6px 24px rgba(20,30,60,.08);
  --radius:16px; --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161b; --panel:#1c1f26; --side:#181a20; --line:#2a2f39; --text:#e7e9ee; --muted:#9aa2b1;
    --accent:#7d9cff; --accent-soft:#232c45; --user:#3a5bd0; --user-text:#fff; --chip:#262b35;
    --ok:#4cc27e; --warn:#e3a443; --bad:#ef6b6b; --shadow:0 6px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 var(--font);display:flex;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--accent)}

/* ---------- sidebar */
#side{width:268px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 6px 8px;font-weight:650;font-size:16px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#7b5cf0);display:grid;place-items:center;color:#fff;flex:none}
.newchat{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600}
.newchat:hover{border-color:var(--accent)}
#history{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px;margin-top:4px}
.hlabel{font-size:12px;color:var(--muted);padding:8px 8px 4px;text-transform:uppercase;letter-spacing:.04em}
.hitem{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;font-size:14px;text-align:left;width:100%}
.hitem span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hitem:hover,.hitem.active{background:var(--panel)}
.hitem .del{opacity:0;color:var(--muted);padding:0 4px}
.hitem:hover .del{opacity:1}
.sidefoot{border-top:1px solid var(--line);padding-top:10px;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.status{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.linkbtn{color:inherit;text-decoration:none;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;text-align:left}
.linkbtn:hover{background:var(--panel)}

/* ---------- main */
#main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:54px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel)}
#menu{display:none;font-size:20px;padding:4px 8px}
header .title{font-weight:600;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
#scroll{flex:1;overflow:auto}
#chat{max-width:860px;margin:0 auto;padding:26px 20px 30px;display:flex;flex-direction:column;gap:22px}

/* welcome */
.welcome{margin:7vh auto 0;text-align:center;max-width:680px}
.welcome .logo{width:56px;height:56px;border-radius:16px;margin:0 auto 16px}
.welcome h1{font-size:28px;margin:0 0 6px;font-weight:650}
.welcome p{color:var(--muted);margin:0 0 26px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.sug{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;font-size:14px}
.sug:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.sug b{display:block;font-size:12px;color:var(--accent);margin-bottom:3px;font-weight:600}

/* messages */
.msg{display:flex;gap:12px}
.msg.user{justify-content:flex-end}
.bubble{background:var(--user);color:var(--user-text);padding:10px 15px;border-radius:18px 18px 4px 18px;max-width:78%;white-space:pre-wrap;word-wrap:break-word}
.avatar{width:30px;height:30px;border-radius:9px;flex:none;background:linear-gradient(135deg,var(--accent),#7b5cf0);display:grid;place-items:center;color:#fff;margin-top:2px}
.bot{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.badge{font-size:12px;padding:2px 9px;border-radius:999px;font-weight:600;background:var(--chip)}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)} .badge.bad{color:var(--bad)}
.answer p{margin:0 0 10px} .answer p:last-child{margin-bottom:0}
.answer ul,.answer ol{margin:4px 0 10px;padding-left:22px}
.cite{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin:0 1px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-size:11.5px;font-weight:700;vertical-align:2px;cursor:pointer}
.cite:hover{background:var(--accent);color:#fff}
.sources{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.sources h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.src{border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;transition:border-color .2s,background .2s}
.src.flash{border-color:var(--accent);background:var(--accent-soft)}
.srchead{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left}
.srchead .n{flex:none;font-weight:700;color:var(--accent);font-size:13px;min-width:22px}
.srchead .t{flex:1;font-size:13.5px}
.srchead .t small{display:block;color:var(--muted);font-size:12.5px}
.quote{margin:7px 0 0 31px;font-size:13px;color:var(--muted);border-left:3px solid var(--accent-soft);padding-left:10px}
.full{margin:8px 0 0 31px;font-size:13px;white-space:pre-wrap;max-height:320px;overflow:auto;background:var(--bg);border-radius:8px;padding:10px}
.tools{display:flex;gap:4px;margin-top:10px;color:var(--muted);font-size:12.5px;align-items:center;flex-wrap:wrap}
.tools button{padding:4px 8px;border-radius:8px}
.tools button:hover{background:var(--chip);color:var(--text)}
.warns{font-size:12.5px;color:var(--warn);margin-top:8px}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted)}
.dots span{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.err{color:var(--bad)}

/* composer */
#composer{padding:10px 20px 18px;background:linear-gradient(transparent,var(--bg) 30%)}
.box{max-width:860px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 8px 16px}
.box:focus-within{border-color:var(--accent)}
#q{width:100%;border:0;outline:0;resize:none;background:transparent;color:var(--text);font:inherit;max-height:200px;min-height:26px;padding:4px 0}
.row{display:flex;align-items:center;gap:8px;margin-top:4px}
#scope{max-width:280px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:5px 10px;font:inherit;font-size:13px}
.spacer{flex:1}
#send{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
#send:disabled{opacity:.35;cursor:default}
.hint{max-width:860px;margin:7px auto 0;font-size:12px;color:var(--muted);text-align:center}

/* dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:22px;width:min(440px,92vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,15,30,.45)}
dialog h3{margin:0 0 6px}
dialog p{color:var(--muted);font-size:14px;margin:0 0 14px}
dialog input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.dlgrow{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn{padding:8px 16px;border-radius:10px;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}

@media (max-width:820px){
  #side{position:fixed;inset:0 auto 0 0;z-index:20;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  #side.open{transform:none}
  #menu{display:block}
  .sugs{grid-template-columns:1fr}
  .bubble{max-width:88%}
  .pill{display:none}
  #chat{padding:18px 12px 24px}
  .avatar{display:none}
}
</style>
</head>
<body>
<aside id="side">
  <div class="brand"><div class="logo">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>
  </div>Compliance Assistant</div>
  <button class="newchat" id="newchat">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
  <div class="hlabel">Recent</div>
  <div id="history"></div>
  <div class="sidefoot">
    <div class="status"><span class="dot" id="hdot"></span><span id="htext">Connecting ...</span></div>
    <button class="linkbtn" id="keybtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3"/></svg>API key</button>
    <a class="linkbtn" href="/docs" target="_blank" rel="noopener">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3h7v7M10 14L21 3M19 14v6a1 1 0 01-1 1H4a1 1 0 01-1-1V6a1 1 0 011-1h6"/></svg>API docs</a>
  </div>
</aside>

<main id="main">
  <header>
    <button id="menu" aria-label="Menu">&#9776;</button>
    <div class="title" id="ctitle">New chat</div>
    <span class="pill" id="mpill">self-hosted</span>
  </header>
  <div id="scroll"><div id="chat"></div></div>
  <div id="composer">
    <div class="box">
      <textarea id="q" rows="1" placeholder="Ask about GwG, DORA, MaRisk, sanctions, MiFID ..."></textarea>
      <div class="row">
        <select id="scope" title="Search in"><option value="">All 50 documents</option></select>
        <div class="spacer"></div>
        <button id="send" title="Send (Enter)" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
    <div class="hint">Answers come only from the indexed regulatory documents and always cite their sources. Runs entirely on this server.</div>
  </div>
</main>

<dialog id="keydlg">
  <form method="dialog">
    <h3>API key</h3>
    <p>This server requires an API key. It is stored only in this browser.</p>
    <input id="keyin" type="password" autocomplete="off" placeholder="X-API-Key">
    <div class="dlgrow"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok" id="keyok">Save</button></div>
  </form>
</dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const store = {
    get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
  };

  // API key: from #key=... (set by the launcher), else localStorage
  let apiKey = store.get("privrag.key", "");
  const hk = new URLSearchParams(location.hash.slice(1)).get("key");
  if (hk) { apiKey = hk; store.set("privrag.key", hk); history.replaceState(null, "", location.pathname); }

  let chats = store.get("privrag.chats", []);          // [{id,title,msgs:[{role,q|a}]}]
  let current = null, busy = false, docs = [];
  const chatEl = $("#chat"), scrollEl = $("#scroll"), q = $("#q"), send = $("#send");

  const SUGGESTIONS = [
    ["HinSchG", "Innerhalb welcher Frist muss die interne Meldestelle den Eingang einer Meldung bestätigen?"],
    ["DORA", "What are the deadlines for reporting major ICT-related incidents under DORA?"],
    ["GwG", "Wann müssen verstärkte Sorgfaltspflichten angewendet werden?"],
    ["MaRisk", "What does MaRisk require from the compliance function?"]
  ];

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const headers = () => { const h = {"Content-Type": "application/json"}; if (apiKey) h["X-API-Key"] = apiKey; return h; };
  const save = () => store.set("privrag.chats", chats.slice(0, 50));
  const fmtMs = ms => ms >= 60000 ? `${Math.floor(ms/60000)}m ${Math.round(ms%60000/1000)}s` : `${(ms/1000).toFixed(1)}s`;

  // ---------- markdown-light rendering with [n] citation chips
  function renderAnswer(text, msgId) {
    const blocks = esc(text).replace(/\r/g, "").split(/\n{2,}/);
    const inline = s => s
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\[(\d{1,2})\]/g, (_, n) => `<span class="cite" data-msg="${msgId}" data-n="${n}">${n}</span>`);
    return blocks.map(b => {
      const lines = b.split("\n");
      if (lines.every(l => /^\s*([-*•]|\d+[.)])\s+/.test(l))) {
        const ordered = /^\s*\d/.test(lines[0]);
        const items = lines.map(l => `<li>${inline(l.replace(/^\s*([-*•]|\d+[.)])\s+/, ""))}</li>`).join("");
        return ordered ? `<ol>${items}</ol>` : `<ul>${items}</ul>`;
      }
      return `<p>${inline(lines.join("<br>"))}</p>`;
    }).join("");
  }

  const STATUS = {
    answered: ["Answered", "ok"], insufficient_sources: ["Not enough sources", "warn"],
    out_of_scope: ["Not in the documents", "warn"], error: ["Error", "bad"]
  };

  function botHTML(a, msgId) {
    if (a.clientError) return `<div class="card"><div class="err">${esc(a.clientError)}</div></div>`;
    const [label, cls] = STATUS[a.status] || [a.status, ""];
    const conf = a.confidence_label ? `<span class="badge ${a.confidence_label === "high" ? "ok" : a.confidence_label === "medium" ? "warn" : "bad"}">Confidence ${esc(a.confidence_label)} · ${Math.round((a.confidence || 0) * 100)}%</span>` : "";
    const cites = (a.citations || []).map(c => `
      <div class="src" id="src-${msgId}-${c.n}">
        <button class="srchead" data-chunk="${esc(c.chunk_id)}">
          <span class="n">[${c.n}]</span>
          <span class="t">${esc(c.title || c.file)}<small>${esc(c.file)}${c.section ? " · " + esc(c.section) : ""} · p. ${c.page_start}${c.page_end !== c.page_start ? "–" + c.page_end : ""}</small></span>
        </button>
        ${c.quote ? `<div class="quote">“${esc(c.quote)}”</div>` : ""}
      </div>`).join("");
    const warns = (a.warnings || []).length ? `<div class="warns">⚠ ${a.warnings.map(esc).join(" · ")}</div>` : "";
    const total = a.latency_ms && a.latency_ms.total;
    return `<div class="card">
      <div class="meta"><span class="badge ${cls}">${esc(label)}</span>${conf}</div>
      <div class="answer">${renderAnswer(a.answer || "", msgId)}</div>
      ${cites ? `<div class="sources"><h4>Sources (${a.citations.length})</h4>${cites}</div>` : ""}
      ${warns}
      <div class="tools">
        <button data-copy="${msgId}">Copy</button>
        ${total ? `<span>· ${fmtMs(total)}</span>` : ""}${a.model ? `<span>· ${esc(a.model)}</span>` : ""}
      </div></div>`;
  }

  // ---------- views
  function renderWelcome() {
    chatEl.innerHTML = `<div class="welcome">
      <div class="logo"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></div>
      <h1>How can I help with compliance today?</h1>
      <p>Ask in English or German. Every answer is grounded in 50 regulatory documents (GwG, BaFin, EBA, DORA, MaRisk, MiFID, sanctions …) with page-exact citations.</p>
      <div class="sugs">${SUGGESTIONS.map(([t, s]) => `<button class="sug" data-q="${esc(s)}"><b>${t}</b>${esc(s)}</button>`).join("")}</div>
    </div>`;
  }

  function renderChat() {
    $("#ctitle").textContent = current ? current.title : "New chat";
    if (!current || !current.msgs.length) { renderWelcome(); renderHistory(); return; }
    chatEl.innerHTML = current.msgs.map((m, i) => m.role === "user"
      ? `<div class="msg user"><div class="bubble">${esc(m.q)}</div></div>`
      : `<div class="msg"><div class="avatar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></div><div class="bot">${botHTML(m.a, current.id + "-" + i)}</div></div>`
    ).join("");
    renderHistory();
    scrollEl.scrollTop = scrollEl.scrollHeight;
  }

  function renderHistory() {
    $("#history").innerHTML = chats.map(c => `
      <button class="hitem ${current && c.id === current.id ? "active" : ""}" data-id="${c.id}">
        <span>${esc(c.title)}</span><b class="del" data-del="${c.id}" title="Delete">✕</b></button>`).join("")
      || `<div style="color:var(--muted);font-size:13px;padding:6px 10px">No conversations yet</div>`;
  }

  function addThinking() {
    const el = document.createElement("div");
    el.className = "msg"; el.id = "thinking";
    el.innerHTML = `<div class="avatar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg></div>
      <div class="bot"><div class="card thinking"><span class="dots"><span></span><span></span><span></span></span><span id="tstep">Searching the documents …</span></div></div>`;
    chatEl.appendChild(el);
    scrollEl.scrollTop = scrollEl.scrollHeight;
    const t0 = Date.now();
    const timer = setInterval(() => {
      const s = Math.round((Date.now() - t0) / 1000);
      const step = s < 4 ? "Searching the documents" : s < 25 ? "Reading the most relevant passages" : "Writing the answer with citations";
      const el2 = document.getElementById("tstep");
      if (el2) el2.textContent = `${step} … ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}` + (s > 45 ? "  (CPU inference can take a few minutes)" : "");
    }, 1000);
    return () => { clearInterval(timer); el.remove(); };
  }

  // ---------- ask
  async function ask(text) {
    text = text.trim();
    if (!text || busy) return;
    if (!current) {
      current = { id: Date.now().toString(36), title: text.slice(0, 60), msgs: [] };
      chats.unshift(current);
    }
    current.msgs.push({ role: "user", q: text });
    save(); renderChat();
    q.value = ""; autosize(); setBusy(true);
    const stop = addThinking();
    const body = { question: text, user: "web-ui" };
    if ($("#scope").value) body.doc_ids = [$("#scope").value];
    let a;
    try {
      const r = await fetch("/ask", { method: "POST", headers: headers(), body: JSON.stringify(body) });
      if (r.status === 401) { a = { clientError: "The API key is missing or wrong. Click “API key” in the sidebar." }; openKey(); }
      else {
        const j = await r.json().catch(() => null);
        if (j && j.answer !== undefined) a = j;
        else a = { clientError: `Server error ${r.status}: ${esc(JSON.stringify(j && (j.detail || j)) || "")}` };
      }
    } catch (e) {
      a = { clientError: "Could not reach the server: " + e.message };
    }
    stop();
    current.msgs.push({ role: "bot", a });
    save(); renderChat(); setBusy(false); q.focus();
  }

  function setBusy(b) { busy = b; send.disabled = b || !q.value.trim(); }
  function autosize() { q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 200) + "px"; send.disabled = busy || !q.value.trim(); }

  // ---------- events
  q.addEventListener("input", autosize);
  q.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
  send.addEventListener("click", () => ask(q.value));
  $("#newchat").addEventListener("click", () => { current = null; renderChat(); $("#side").classList.remove("open"); q.focus(); });
  $("#menu").addEventListener("click", () => $("#side").classList.toggle("open"));

  $("#history").addEventListener("click", e => {
    const del = e.target.closest("[data-del]");
    if (del) {
      chats = chats.filter(c => c.id !== del.dataset.del);
      if (current && current.id === del.dataset.del) current = null;
      save(); renderChat(); e.stopPropagation(); return;
    }
    const it = e.target.closest("[data-id]");
    if (it) { current = chats.find(c => c.id === it.dataset.id) || null; renderChat(); $("#side").classList.remove("open"); }
  });

  chatEl.addEventListener("click", async e => {
    const sug = e.target.closest("[data-q]");
    if (sug) { ask(sug.dataset.q); return; }
    const cite = e.target.closest(".cite");
    if (cite) {
      const t = document.getElementById(`src-${cite.dataset.msg}-${cite.dataset.n}`);
      if (t) { t.scrollIntoView({ behavior: "smooth", block: "center" }); t.classList.add("flash"); setTimeout(() => t.classList.remove("flash"), 1400); }
      return;
    }
    const copy = e.target.closest("[data-copy]");
    if (copy) {
      const card = copy.closest(".card");
      navigator.clipboard?.writeText(card.querySelector(".answer").innerText).then(() => { copy.textContent = "Copied"; setTimeout(() => copy.textContent = "Copy", 1200); });
      return;
    }
    const head = e.target.closest(".srchead");
    if (head) {
      const src = head.parentElement, open = src.querySelector(".full");
      if (open) { open.remove(); return; }
      const div = document.createElement("div"); div.className = "full"; div.textContent = "Loading …"; src.appendChild(div);
      try {
        const r = await fetch("/sources/" + encodeURIComponent(head.dataset.chunk), { headers: headers() });
        const j = await r.json();
        div.textContent = r.ok ? (j.text || JSON.stringify(j, null, 1)) : "Could not load the source (" + r.status + ")";
      } catch (err) { div.textContent = "Could not load the source: " + err.message; }
    }
  });

  // ---------- API key dialog
  const dlg = $("#keydlg");
  function openKey() { $("#keyin").value = apiKey; if (!dlg.open) dlg.showModal(); }
  $("#keybtn").addEventListener("click", openKey);
  dlg.addEventListener("close", () => {
    if (dlg.returnValue === "ok") { apiKey = $("#keyin").value.trim(); store.set("privrag.key", apiKey); loadDocs(); }
  });

  // ---------- server status + document list
  async function health() {
    try {
      const r = await fetch("/health"); const h = await r.json();
      const ok = h.status === "ok";
      $("#hdot").className = "dot " + (ok ? "ok" : "warn");
      $("#htext").textContent = ok ? `Online · ${(h.index_points || 0).toLocaleString()} passages` : "Starting / degraded";
      if (h.llm_model) $("#mpill").textContent = h.llm_model;
    } catch {
      $("#hdot").className = "dot bad"; $("#htext").textContent = "Server not reachable";
    }
  }
  async function loadDocs() {
    try {
      const r = await fetch("/documents", { headers: headers() });
      if (r.status === 401) { openKey(); return; }
      docs = await r.json();
      const sel = $("#scope"), cur = sel.value;
      sel.innerHTML = `<option value="">All ${docs.length} documents</option>` +
        docs.map(d => `<option value="${esc(d.doc_id)}">${esc(d.doc_id.replace(/_/g, " "))}</option>`).join("");
      sel.value = cur;
    } catch {}
  }

  renderChat(); health(); loadDocs(); setInterval(health, 30000); q.focus();
})();
</script>
</body>
</html>
